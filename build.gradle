import java.io.File

plugins {
	id "java-library"
	id "com.gtnewhorizons.retrofuturagradle" version "1.4.9"
	id 'com.github.johnrengelman.shadow' version '7.1.2'
}

archivesBaseName = "${project.mod_id}-mc${project.minecraft_version}-${project.mod_version}"

// Set the toolchain version to decouple the Java we run Gradle with from the Java used to compile and run the mod
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        // Azul covers the most platforms for Java 8 toolchains, crucially including MacOS arm64
        vendor.set(org.gradle.jvm.toolchain.JvmVendorSpec.AZUL)
    }
}

minecraft {
	mcVersion.set(minecraft_version)
	username.set("Developer")

	injectedTags.put("MOD_VERSION", mod_version)
	injectedTags.put("MOD_NAME", "Spectra")
}

tasks.injectTags.outputClassName.set("${mod_base_package}.Tags")

tasks.deobfuscateMergedJarToSrg.configure {accessTransformerFiles.from("src/main/resources/META-INF/oculus_at.cfg")}

repositories {
	mavenLocal()
	maven {	url "https://maven.cleanroommc.com" }
	maven {
        name 'SpongePowered Maven'
        url 'https://repo.spongepowered.org/maven'
    }
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	def mixinBooter = modUtils.enableMixins("zone.rong:mixinbooter:8.9", "oculus-mixins-refmap.json")
    api (mixinBooter) {
        transitive = false
    }
	annotationProcessor "org.ow2.asm:asm-debug-all:5.2"
    annotationProcessor "com.google.guava:guava:32.1.2-jre"
    annotationProcessor "com.google.code.gson:gson:2.8.9"
    annotationProcessor (mixinBooter) {
        transitive = false
    }

	//modCompileOnly "maven.modrinth:rubidium:0.2.13"

	implementation(shadow(project(path: ":glsl-relocated", configuration: "bundledJar"))) {
		transitive = false
	}
	implementation(shadow("org.anarres:jcpp:1.4.14")) {
		transitive = false
	}
	shadow("org.slf4j:slf4j-api:1.7.12") // for jcpp

	implementation fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
	filesMatching("mcmod.info") { fcd ->
        fcd.expand(
                'mod_id': project.mod_id,
                'mod_name': project.mod_name,
                'mod_version': project.mod_version,
                'mod_description': project.mod_description,
                'minecraft_version': project.minecraft_version
        )
    }
}

shadowJar {
	configurations = [project.configurations.shadow]

	from jar.archiveFile

	relocate 'org.apache.commons.collections4', 'oculus.org.apache.commons.collections4'
	relocate 'org.anarres.cpp', 'oculus.org.anarres.cpp'
	relocate 'org.slf4j', 'oculus.org.slf4j'

	archiveClassifier.set "shadow"

	manifest {
		attributes(
				'Main-Class': 'net.coderbot.iris.LaunchWarn'
		)
	}
}

// TEMP 1.12.2 port step: disable modern 1.16+/1.20 sources.
// The Asek3 1.12.2 branch still contains lots of newer Iris/Oculus code.
// We exclude any source file that imports modern Blaze3D/RenderType/MultiBufferSource APIs,
// then we will re-port the needed pieces one by one.
tasks.withType(JavaCompile).configureEach {
    source = source.filter { file ->
        def p = file.path.replace(File.separatorChar, '/' as char)

        if (!p.endsWith('.java')) {
            return true
        }

        def text = file.getText('UTF-8')

        boolean modernPath =
            p.contains('/src/main/java/net/irisshaders/iris/api/') ||
            p.contains('/src/main/java/net/coderbot/batchedentityrendering/') ||
            p.contains('/src/main/java/net/coderbot/iris/apiimpl/') ||
            p.contains('/src/main/java/net/coderbot/iris/compat/sodium/') ||
            p.contains('/src/main/java/net/coderbot/iris/config/') ||
            p.contains('/src/main/java/net/coderbot/iris/colorspace/') ||
            p.contains('/src/main/java/net/coderbot/iris/fantastic/') ||
            p.contains('/src/main/java/net/coderbot/iris/gui/') ||
            p.contains('/src/main/java/net/coderbot/iris/block_rendering/') ||
            p.contains('/src/main/java/net/coderbot/iris/gl/blending/') ||
            p.contains('/src/main/java/net/coderbot/iris/gl/program/') ||
            p.contains('/src/main/java/net/coderbot/iris/gl/sampler/') ||
            p.contains('/src/main/java/net/coderbot/iris/gl/image/') ||
            p.contains('/src/main/java/net/coderbot/iris/gl/framebuffer/') ||
            p.contains('/src/main/java/net/coderbot/iris/gl/shader/') ||
            p.contains('/src/main/java/net/coderbot/iris/shaderpack/') ||
            p.contains('/src/main/java/net/coderbot/iris/gl/texture/') ||
            p.contains('/src/main/java/net/coderbot/iris/gl/uniform/') ||
            p.contains('/src/main/java/net/coderbot/iris/helpers/') ||
            p.contains('/src/main/java/net/coderbot/iris/layer/') ||
            p.contains('/src/main/java/net/coderbot/iris/mixin/') ||
            p.contains('/src/main/java/net/coderbot/iris/pipeline/') ||
            p.contains('/src/main/java/net/coderbot/iris/postprocess/') ||
            p.contains('/src/main/java/net/coderbot/iris/rendertarget/') ||
            p.contains('/src/main/java/net/coderbot/iris/shadows/') ||
            p.contains('/src/main/java/net/coderbot/iris/shadow/') ||
            p.contains('/src/main/java/net/coderbot/iris/texture/') ||
            p.contains('/src/main/java/net/coderbot/iris/uniforms/') ||
            p.contains('/src/main/java/net/coderbot/iris/vertices/') ||
            p.endsWith('/src/main/java/net/coderbot/iris/JomlConversions.java')

        boolean modernImports =
            text.contains('com.mojang.blaze3d') ||
            text.contains('com.mojang.math') ||
            text.contains('net.minecraft.client.Camera') ||
            text.contains('net.minecraft.client.multiplayer.ClientLevel') ||
            text.contains('net.minecraft.client.renderer.LevelRenderer') ||
            text.contains('net.minecraft.client.renderer.MultiBufferSource') ||
            text.contains('net.minecraft.client.renderer.RenderBuffers') ||
            text.contains('net.minecraft.client.renderer.RenderType') ||
            text.contains('net.minecraft.client.renderer.ItemBlockRenderTypes') ||
            text.contains('net.minecraft.client.renderer.GameRenderer') ||
            text.contains('net.minecraft.world.entity') ||
            text.contains('net.minecraft.world.item') ||
            text.contains('net.minecraft.world.level') ||
            text.contains('net.minecraft.world.phys') ||
            text.contains('net.minecraft.core.') ||
            text.contains('net.minecraftforge.fml.loading') ||
            text.contains('org.lwjgl.system') ||
            text.contains('org.lwjgl.opengl.GL11C') ||
            text.contains('org.lwjgl.opengl.GL13C') ||
            text.contains('org.lwjgl.opengl.GL20C') ||
            text.contains('org.lwjgl.opengl.GL30C') ||
            text.contains('net.coderbot.iris.pipeline.') ||
            text.contains('net.coderbot.iris.postprocess.') ||
            text.contains('net.coderbot.iris.rendertarget.') ||
            text.contains('net.coderbot.iris.shadows.') ||
            text.contains('net.coderbot.iris.shadow.') ||
            text.contains('net.coderbot.iris.colorspace.') ||
            text.contains('net.coderbot.iris.vertices.') ||
            text.contains('net.coderbot.iris.gl.IrisRenderSystem')

        boolean brokenCompat =
            p.endsWith('/src/main/java/nanolive/compat/NativeImage.java')

        return !(modernPath || modernImports || brokenCompat)
    }
}